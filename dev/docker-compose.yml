# Local development ClickHouse.
#
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml down -v     # drop the data too
#
# The password here belongs to local development, is not a secret, and is not used
# in production. ClickHouse Cloud credentials come from environment variables, see
# pipeline/db.py.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: cinema-clickhouse
    ports:
      # 18123 instead of 8123: avoid clashing with another ClickHouse on the machine
      - "127.0.0.1:18123:8123"
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dev
    volumes:
      # zz- prefix: so it is read last when config.d is merged
      - ./clickhouse-listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "dev", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
