# Yerel geliştirme ClickHouse'u.
#
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml down -v     # veriyi de sil
#
# Buradaki şifre yerel geliştirmeye ait, gizli bir bilgi değil ve üretimde
# kullanılmıyor. ClickHouse Cloud kimlik bilgileri ortam değişkenlerinden geliyor,
# bkz. pipeline/db.py.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: cinema-clickhouse
    ports:
      # 8123 yerine 18123: makinede başka bir ClickHouse varsa çakışmasın
      - "127.0.0.1:18123:8123"
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dev
    volumes:
      # zz- öneki: config.d birleştirmesinde en son okunsun
      - ./clickhouse-listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "dev", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
