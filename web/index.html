<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- English by default. The i18n module pulls lang and title to the chosen locale on
         startup; these values cover the state before JS runs, and search engines. -->
    <title>Tweezr — word-level dialogue search and rough cut</title>
    <meta
      name="description"
      content="Find a spoken line in your footage down to the word, rank the takes by how they were delivered, and assemble the rough cut without rendering anything."
    />
    <!-- The font is served from this origin, so there is no third-party request on the
         critical path. Preloaded because the whole page is set in it. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body>
    <!-- One root. The interface is built entirely from JS and innerHTML is used nowhere;
         the text comes from Whisper output and filenames, which is data we do not
         control. -->
    <div id="app"></div>

    <noscript>
      <p style="padding: 2rem; font: 16px system-ui">
        Tweezr runs the editing timeline in the browser, so it needs JavaScript.
      </p>
    </noscript>

    <!-- No build step: the file being served is the source. The modules use native ES
         imports; no bundler, no node_modules. -->
    <script type="module" src="/src/main.js?v=2"></script>
  </body>
</html>
