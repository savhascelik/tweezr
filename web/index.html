<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- İngilizce varsayılan. i18n modülü açılışta lang ve title'ı seçilen dile
         çekiyor; buradaki değerler JS gelmeden önce ve arama motorları için. -->
    <title>Line search and rough cut</title>
    <meta
      name="description"
      content="Find a spoken line in your library down to the word, rank takes by delivery, and propose a rough cut on the timeline without rendering anything."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Tek kök. Arayüz tamamen JS'ten kuruluyor ve hiçbir yerde innerHTML
         kullanılmıyor; metinlerin kaynağı Whisper çıktısı ve dosya adları, yani
         kontrol etmediğimiz veri. -->
    <div id="app"></div>

    <noscript>
      <p style="padding: 2rem; font: 16px system-ui">
        This tool runs the editing timeline in the browser, so it needs JavaScript.
      </p>
    </noscript>

    <!-- Build adımı yok: servis edilen dosya kaynağın kendisi. Modüller native
         ES import kullanıyor, bundler yok, node_modules yok. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
