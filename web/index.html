<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- English by default. The i18n module pulls lang and title to the chosen locale on
         startup; these values cover the state before JS runs, and search engines. -->
    <title>Line search and rough cut</title>
    <meta
      name="description"
      content="Find a spoken line in your library down to the word, rank takes by delivery, and propose a rough cut on the timeline without rendering anything."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- One root. The interface is built entirely from JS and innerHTML is used nowhere;
         the text comes from Whisper output and filenames, which is data we do not
         control. -->
    <div id="app"></div>

    <noscript>
      <p style="padding: 2rem; font: 16px system-ui">
        This tool runs the editing timeline in the browser, so it needs JavaScript.
      </p>
    </noscript>

    <!-- No build step: the file being served is the source. The modules use native ES
         imports; no bundler, no node_modules. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
